<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Central TABU</title>
    <link rel="stylesheet" href="/src/login/index.css">
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-lilith.png">
</head>

<body>
    <form action="https://www.youtube.com/watch?v=-oveTKMfj-Y" method="post">
        <fieldset>
            <legend class="formTitle">Login</legend>

            <label for="user">Usuário</label>
            <input type="text" name="user" id="user" class="loginInfo" required autofocus>

            <label for="password">Senha</label>
            <input type="password" name="password" id="password" class="loginInfo" required>

            <div class="buttonSection">
                <div>
                    <a id="submit" class="submitButton">Login</a>
                    <a href="/src/login/cadastro.html" class="registerButton">Cadastrar-se</a>
                </div>
                <a class="forgetPassword" href="#">Esqueci minha senha</a>
            </div>

        </fieldset>
    </form>
    <script src="/src/login/index.js" type="module"></script>
</body>

</html>
