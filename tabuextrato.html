<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Histórico de Vendas</title>
    <link rel="stylesheet" href="tabuextrato.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="/sources/favicon-system.png">
</head>

<body>
    <div class="container">
        <header>
            <h1>Histórico de Vendas</h1>
        </header>

        <div class="filters">

            <div class="input-group">
                <label>ID da Venda</label>
                <input type="number" id="saleId" placeholder="Ex: 152">
            </div>

            <div class="input-group">
                <label>Data Inicial</label>
                <input type="date" id="startDate">
            </div>

            <div class="input-group">
                <label>Data Final</label>
                <input type="date" id="endDate">
            </div>

            <button id="filterBtn">
                Filtrar
            </button>

        </div>

        <div id="salesContainer" class="sales-container"> </div>
    </div>
    <script src="tabuextrato.js" type="module"></script>
</body>

</html>
