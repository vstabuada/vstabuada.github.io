<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TABU SYSTEM</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <link rel="icon" type="image/png" href="/sources/favicon-system.png">



    <link rel="stylesheet" href="tom-select.css">
    <link rel="stylesheet" href="tabusistema.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">


</head>

<body>
    <!--     <audio id="alertSound" preload="auto">
        <source src="sons/notificacao.mp3" type="audio/mpeg">
    </audio> -->

    <header>

        <div class="logo">
            TABU SYSTEM
        </div>

        <div class="top-buttons">

            <button id="configBtn" class="config-btn">

                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>

                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>

                </svg>

            </button>

            <a class="top-btn" href="tabuextrato.html">
                Histórico
            </a>

        </div>

    </header>

    <div class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="card">

                <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar produto...">

                <div id="categories"></div>

            </div>

        </aside>

        <!-- MAIN -->
        <main class="main">

            <div class="cart">

                <div class="cart-header">

                    <h2>Venda Atual</h2>

                    <div id="date"></div>

                </div>

                <div class="cart-items" id="cartItems"></div>

            </div>

            <div class="totals">

                <div class="total-card summary-card">

                    <div class="total-title">
                        Resumo da Venda
                    </div>

                    <div class="total-value" id="subtotal">
                        R$ 0,00
                    </div>

                    <div class="summary-info">

                        <div class="summary-row">
                            <span>Itens</span>
                            <strong id="totalItems">
                                0
                            </strong>
                        </div>

                        <div class="summary-row">
                            <span>Produtos únicos</span>
                            <strong id="uniqueItems">
                                0
                            </strong>
                        </div>

                        <div class="summary-row">
                            <span>Horário</span>
                            <strong id="saleTime">
                                --
                            </strong>
                        </div>

                    </div>

                </div>

                <div class="total-card">

                    <div class="total-title">
                        Forma de Pagamento
                    </div>

                    <select class="select" id="paymentMethod">
                        <option class="select-option">Dinheiro</option>
                        <option class="select-option">PIX</option>
                        <option class="select-option">Débito</option>
                        <option class="select-option">Crédito</option>
                    </select>

                    <textarea class="textarea" placeholder="Observações da venda..." id="note"></textarea>

                    <button class="finish-btn" onclick="finishSale()">
                        Finalizar Venda
                    </button>

                </div>

            </div>

        </main>

    </div>

    <!-- POPUP -->

    <div class="popup" id="historyPopup">

        <div class="popup-content">

            <h2>
                Histórico de Vendas
            </h2>

            <div id="historyList"></div>

            <button class="close-btn" onclick="closeHistory()">
                Fechar
            </button>

        </div>

    </div>

    <script src="tabusistema.js" type="module"></script>

</body>

</html>
